version: '3.8'

services:
  codereview-ai:
    build: .
    container_name: codereview-ai
    ports:
      - "8080:8080"
    environment:
      - GITLAB_TOKEN=${GITLAB_TOKEN}
      - GITLAB_URL=${GITLAB_URL:-https://gitlab.com}
      - GITLAB_PROJECT_ID=${GITLAB_PROJECT_ID}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=8080
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./logs:/app/logs
    networks:
      - codereview-network

networks:
  codereview-network:
    driver: bridge
