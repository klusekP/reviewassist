name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# cancel an older run of the same branch / PR when a new commit arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          go vet -tags agent ./...   # compile the Claude Code integration test too

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -o /dev/null .

      - name: Check web UI scripts
        run: |
          node --check static/js/i18n.js
          node --check static/js/app.js
