<!doctype html>
<html lang="pl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Review AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body x-data="app()" x-init="init()">

<!-- icon sprite -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-dashboard" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-3.9M4 4v4h4M4 13a8 8 0 0 0 14.9 3.9M20 20v-4h-4"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-branch" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10M18 10a6 6 0 0 1-6 6H8"/></symbol>
  <symbol id="i-merge" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="15" r="2"/><path d="M6 7v10M6 9a8 8 0 0 0 8 6h2"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7z"/><path d="M14 3v4h4"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 3"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></symbol>
</svg>

<div class="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">AI</div>
      <span>codereview</span>
      <small x-text="config.engine || ''"></small>
    </div>

    <div class="side-actions">
      <button class="btn-primary-wide" @click="go('#/')"><svg class="icon"><use href="#i-dashboard"/></svg><span x-text="t('nav.overview')"></span></button>
      <button class="btn-square" :title="t('nav.refreshProjects')" @click="loadProjects(true)"><svg class="icon"><use href="#i-refresh"/></svg></button>
      <button class="btn-square" :class="{ active: route.view === 'settings' }" :title="t('common.settings')" @click="go('#/settings')"><svg class="icon"><use href="#i-gear"/></svg></button>
    </div>

    <div class="side-scroll">
      <div class="side-section">
        <span x-text="t('common.projects')"></span>
        <span class="faint" x-text="projects.length || ''"></span>
      </div>

      <template x-if="projectsLoading && !projects.length">
        <div style="padding: 6px 12px; display: grid; gap: 10px;">
          <div class="skeleton" style="width: 80%"></div><div class="skeleton" style="width: 60%"></div><div class="skeleton" style="width: 70%"></div>
        </div>
      </template>
      <template x-if="projectsError">
        <div class="tree-empty"><span style="color: var(--red)" x-text="t('common.error', { msg: projectsError })"></span><br /><a href="#/settings" style="text-decoration: underline" x-text="t('nav.checkGitlab')"></a></div>
      </template>

      <template x-for="p in visibleTreeProjects" :key="p.id">
        <div class="tree-project">
          <div class="tree-row" :class="{ selected: route.view === 'project' && route.pid === p.id }" @click="openProject(p.id)" :title="p.name_with_namespace">
            <span class="tree-chevron" :class="{ open: expanded[p.id] || search }" @click.stop="toggleExpand(p.id)">
              <svg class="icon icon-sm"><use href="#i-chevron"/></svg>
            </span>
            <span class="tree-name ellipsis" x-text="p.name"></span>
            <span class="count-badge" :class="{ zero: !p.open_mrs }" x-text="p.open_mrs"></span>
          </div>
          <div class="tree-children" x-show="expanded[p.id] || (search && treeMRs(p.id).length)" x-cloak>
            <template x-if="list(p.id).loading && !list(p.id).items.length"><div class="tree-empty" x-text="t('nav.loading')"></div></template>
            <template x-if="list(p.id).error"><div class="tree-empty" style="color: var(--red)" x-text="list(p.id).error"></div></template>
            <template x-if="list(p.id).loaded && !list(p.id).items.length"><div class="tree-empty" x-text="t('nav.noOpenMRs')"></div></template>
            <template x-for="m in treeMRs(p.id)" :key="m.iid">
              <div class="tree-mr" :class="{ selected: route.view === 'mr' && route.pid === p.id && route.iid === m.iid }" @click="openMR(p.id, m.iid)" :title="m.title">
                <span class="dot" :class="status(p.id, m).dot"></span>
                <span class="ellipsis" style="flex: 1" x-text="m.title"></span>
                <span class="iid" x-text="'!' + m.iid"></span>
              </div>
            </template>
          </div>
        </div>
      </template>

      <template x-if="hiddenProjectsCount">
        <button class="tree-more" @click="showAllProjects = true" x-text="t('nav.showProjectsWithoutMRs', { n: hiddenProjectsCount })"></button>
      </template>
      <template x-if="showAllProjects && !search">
        <button class="tree-more" @click="showAllProjects = false" x-text="t('nav.hideProjectsWithoutMRs')"></button>
      </template>

      <template x-if="runningList.length">
        <div>
          <div class="side-section"><span x-text="t('nav.running')"></span></div>
          <template x-for="r in runningList" :key="r.key">
            <div class="recent-item" @click="openMR(r.pid, r.iid)">
              <span class="dot purple pulse"></span>
              <span class="ellipsis" style="flex: 1" x-text="r.title"></span>
              <span class="when" x-text="elapsed(r.started_at)"></span>
            </div>
          </template>
        </div>
      </template>

      <template x-if="recentReviews.length">
        <div>
          <div class="side-section"><span x-text="t('common.recentReviews')"></span></div>
          <template x-for="r in recentReviews.slice(0, 6)" :key="r.key">
            <div class="recent-item" @click="openMR(r.pid, r.iid)">
              <span class="dot" :class="verdict(r.verdict)?.dot || 'blue'"></span>
              <span class="ellipsis" style="flex: 1" x-text="r.title"></span>
              <span class="when" x-text="relTime(r.timestamp)"></span>
            </div>
          </template>
        </div>
      </template>
    </div>

    <div class="side-footer">
      <label class="search-box">
        <svg class="icon icon-sm"><use href="#i-search"/></svg>
        <input x-ref="search" x-model="search" :placeholder="t('nav.search')" :title="t('nav.searchTitle')" />
        <span class="kbd">Ctrl+K</span>
      </label>
      <div class="footer-row">
        <span class="pill-outline" :title="t('nav.engine', { engine: (config.engine || '?') + (config.model ? ' · ' + config.model : '') })">
          <span class="dot" :class="wsConnected ? 'green' : 'red'"></span>
          <span class="ellipsis" x-text="(config.engine || '…') + (config.model ? ' · ' + config.model : '')"></span>
        </span>
        <span class="pill-outline" x-show="config.jira_enabled" :title="t('nav.jiraTitle')">jira</span>
        <span class="pill-outline" :title="t('nav.reviewLanguage', { lang: config.language || 'pl' })" x-text="config.language || 'pl'"></span>
        <button class="icon-btn ml-auto" :title="t('common.settings')" @click="go('#/settings')"><svg class="icon"><use href="#i-gear"/></svg></button>
        <button class="icon-btn mono" @click="cycleLang()" :title="t('lang.switch', { name: t('lang.name') })" x-text="lang.toUpperCase()"></button>
        <button class="icon-btn" @click="toggleTheme()" :title="t(theme === 'dark' ? 'nav.lightTheme' : 'nav.darkTheme')">
          <svg class="icon"><use :href="theme === 'dark' ? '#i-moon' : '#i-sun'"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main">

    <!-- ---------- DASHBOARD ---------- -->
    <template x-if="route.view === 'dashboard'">
      <div style="display: contents">
        <div class="page-head">
          <div class="page-title" x-text="t('nav.overview')"></div>
          <div class="head-actions">
            <button class="btn-ghost" @click="loadProjects(true)"><svg class="icon"><use href="#i-refresh"/></svg><span x-text="t('common.refresh')"></span></button>
          </div>
        </div>
        <div class="content">
          <div class="tiles">
            <div class="tile"><div class="label" x-text="t('common.projects')"></div><div class="value" x-text="projects.length"></div></div>
            <div class="tile"><div class="label" x-text="t('common.openMRs')"></div><div class="value" x-text="totalOpen"></div></div>
            <div class="tile"><div class="label" x-text="t('dash.runningReviews')"></div><div class="value" x-text="runningList.length"></div></div>
            <div class="tile"><div class="label" x-text="t('dash.doneReviews')"></div><div class="value" x-text="recentReviews.length"></div></div>
          </div>

          <div class="section-title" x-text="t('common.projects')"></div>
          <div class="table-card">
            <table class="grid">
              <thead><tr><th x-text="t('common.project')"></th><th class="hide-md" x-text="t('dash.defaultBranch')"></th><th class="num" x-text="t('common.openMRs')"></th><th class="num" x-text="t('dash.activity')"></th></tr></thead>
              <tbody>
                <template x-if="projectsLoading && !projects.length">
                  <tr><td colspan="4"><div class="skeleton" style="width: 40%"></div></td></tr>
                </template>
                <template x-for="p in projects" :key="p.id">
                  <tr @click="openProject(p.id)">
                    <td>
                      <div class="mr-title"><span class="t" x-text="p.name"></span></div>
                      <div class="faint mono" style="margin-top: 2px" x-text="p.path_with_namespace"></div>
                    </td>
                    <td class="hide-md"><span class="branch" x-text="p.default_branch || '—'"></span></td>
                    <td class="num"><span class="count-badge" :class="{ zero: !p.open_mrs }" x-text="p.open_mrs"></span></td>
                    <td class="num faint" x-text="relTime(p.last_activity_at)"></td>
                  </tr>
                </template>
              </tbody>
            </table>
            <template x-if="!projectsLoading && !projects.length && !projectsError">
              <div class="empty"><h3 x-text="t('dash.noProjects')"></h3><span x-text="t('dash.noProjectsText')"></span><br /><a class="btn-primary" href="#/settings" x-text="t('dash.openSettings')"></a></div>
            </template>
            <template x-if="projectsError">
              <div class="empty"><h3 x-text="t('dash.gitlabFailed')"></h3><span x-text="projectsError"></span><br /><a class="btn-primary" href="#/settings" x-text="t('dash.configureGitlab')"></a></div>
            </template>
          </div>

          <template x-if="recentReviews.length">
            <div>
              <div class="section-title" x-text="t('common.recentReviews')"></div>
              <div class="table-card">
                <table class="grid">
                  <thead><tr><th x-text="t('dash.verdict')"></th><th>Merge request</th><th class="hide-md" x-text="t('common.project')"></th><th class="num" x-text="t('common.score')"></th><th class="num" x-text="t('dash.when')"></th></tr></thead>
                  <tbody>
                    <template x-for="r in recentReviews.slice(0, 12)" :key="r.key">
                      <tr @click="openMR(r.pid, r.iid)">
                        <td><span class="status-pill"><span class="dot" :class="verdict(r.verdict)?.dot || 'blue'"></span><span x-text="verdict(r.verdict)?.short || t('status.reviewed')"></span></span></td>
                        <td><div class="mr-title"><span class="t" x-text="r.title"></span><span class="faint mono" x-text="'!' + r.iid"></span></div></td>
                        <td class="hide-md muted" x-text="project(r.pid)?.name || r.pid"></td>
                        <td class="num" x-text="r.score ? r.score + '/10' : '—'"></td>
                        <td class="num faint" x-text="relTime(r.timestamp)"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>

    <!-- ---------- PROJECT: MR LIST ---------- -->
    <template x-if="route.view === 'project'">
      <div style="display: contents">
        <div class="page-head">
          <div class="page-title ellipsis" x-text="currentProject?.name || t('list.projectN', { pid: route.pid })"></div>
          <div class="segmented">
            <button :class="{ on: listState === 'opened' }" @click="setListState('opened')"><span x-text="t('list.opened')"></span> <span class="n" x-text="list(route.pid, 'opened').items.length"></span></button>
            <button :class="{ on: listState === 'merged' }" @click="setListState('merged')" x-text="t('list.merged')"></button>
            <button :class="{ on: listState === 'closed' }" @click="setListState('closed')" x-text="t('list.closed')"></button>
          </div>
          <div class="head-actions">
            <label class="search-box head-search">
              <svg class="icon icon-sm"><use href="#i-search"/></svg>
              <input x-model="listQuery" :placeholder="t('list.search')" />
            </label>
            <button class="btn-ghost" @click="refreshCurrent()"><svg class="icon"><use href="#i-refresh"/></svg><span class="hide-md" x-text="t('common.refresh')"></span></button>
            <a class="btn-ghost" :href="currentProject?.web_url + '/-/merge_requests'" target="_blank" rel="noopener" x-show="currentProject"><svg class="icon"><use href="#i-external"/></svg><span class="hide-md">GitLab</span></a>
          </div>
        </div>
        <div class="content">
          <div class="table-card">
            <table class="grid fixed">
              <colgroup><col style="width: 160px" /><col /><col class="hide-md" style="width: 280px" /><col class="hide-md" style="width: 160px" /><col style="width: 76px" /><col style="width: 112px" /><col style="width: 128px" /></colgroup>
              <thead>
                <tr><th x-text="t('list.status')"></th><th>Merge request</th><th class="hide-md" x-text="t('common.branches')"></th><th class="hide-md" x-text="t('common.author')"></th><th class="num" x-text="t('common.score')"></th><th class="num" x-text="t('list.issues')"></th><th class="num" x-text="t('list.updated')"></th></tr>
              </thead>
              <tbody>
                <template x-for="n in (list(route.pid, listState).loading && !list(route.pid, listState).items.length ? 5 : 0)" :key="'sk' + n">
                  <tr><td colspan="7"><div class="skeleton" :style="'width:' + (40 + n * 9) + '%'"></div></td></tr>
                </template>
                <template x-for="m in currentList" :key="m.iid">
                  <tr @click="openMR(route.pid, m.iid)">
                    <td><span class="status-pill"><span class="dot" :class="status(route.pid, m).dot"></span><span x-text="status(route.pid, m).label"></span></span></td>
                    <td>
                      <div class="mr-title"><span class="t" x-text="m.title"></span><span class="faint mono" x-text="'!' + m.iid"></span></div>
                      <div class="mr-sub" x-show="m.draft || m.has_conflicts || m.labels.length">
                        <span class="chip draft" x-show="m.draft">draft</span>
                        <span class="chip danger" x-show="m.has_conflicts" x-text="t('common.conflicts')"></span>
                        <template x-for="l in m.labels.slice(0, 4)" :key="l"><span class="chip label" x-text="l"></span></template>
                      </div>
                    </td>
                    <td class="hide-md"><div class="branches" :title="m.source_branch + ' → ' + m.target_branch"><span class="branch" x-text="m.source_branch"></span><span class="faint">→</span><span class="branch" x-text="m.target_branch"></span></div></td>
                    <td class="hide-md muted ellipsis" x-text="m.author?.name"></td>
                    <td class="num" x-text="review(route.pid, m.iid)?.score ? review(route.pid, m.iid).score + '/10' : '—'"></td>
                    <td class="num">
                      <template x-if="review(route.pid, m.iid)">
                        <span class="issue-dots">
                          <span x-show="severityCounts(review(route.pid, m.iid)).critical + severityCounts(review(route.pid, m.iid)).high" class="del"><span class="dot red"></span><span x-text="severityCounts(review(route.pid, m.iid)).critical + severityCounts(review(route.pid, m.iid)).high"></span></span>
                          <span x-show="severityCounts(review(route.pid, m.iid)).medium" style="color: var(--yellow)"><span class="dot yellow"></span><span x-text="severityCounts(review(route.pid, m.iid)).medium"></span></span>
                          <span x-show="severityCounts(review(route.pid, m.iid)).low" class="muted"><span class="dot blue"></span><span x-text="severityCounts(review(route.pid, m.iid)).low"></span></span>
                          <span x-show="!(review(route.pid, m.iid).issues || []).length" class="add">0</span>
                        </span>
                      </template>
                      <template x-if="!review(route.pid, m.iid)"><span class="faint">—</span></template>
                    </td>
                    <td class="num faint" x-text="relTime(m.updated_at)"></td>
                  </tr>
                </template>
              </tbody>
            </table>
            <template x-if="list(route.pid, listState).error">
              <div class="empty"><h3 x-text="t('common.fetchMRFailed')"></h3><span x-text="list(route.pid, listState).error"></span></div>
            </template>
            <template x-if="list(route.pid, listState).loaded && !currentList.length">
              <div class="empty"><h3 x-text="t(listQuery ? 'list.noResults' : 'list.noMRs')"></h3><span x-show="!listQuery" x-text="t('list.noMRsText')"></span></div>
            </template>
          </div>
        </div>
      </div>
    </template>

    <!-- ---------- MR DETAIL ---------- -->
    <template x-if="route.view === 'mr'">
      <div style="display: contents">
        <template x-if="detailLoading && !detail">
          <div class="content"><div class="skeleton" style="width: 40%; height: 22px"></div><div class="skeleton" style="width: 60%; margin-top: 14px"></div></div>
        </template>
        <template x-if="detailError && !detail">
          <div class="content"><div class="empty"><h3 x-text="t('common.fetchMRFailed')"></h3><span x-text="detailError"></span></div></div>
        </template>

        <template x-if="detail">
          <div style="display: contents">
            <div class="mr-head">
              <div class="mr-head-top">
                <div style="min-width: 0; flex: 1">
                  <h1 x-text="detail.mr.title"></h1>
                  <div class="mr-meta">
                    <span class="mono-chip" x-text="'!' + detail.mr.iid"></span>
                    <span class="muted" x-text="currentProject?.name"></span>
                    <span class="sep">·</span>
                    <span x-text="detail.mr.author?.name"></span>
                    <span class="sep">·</span>
                    <span class="branch" x-text="detail.mr.source_branch"></span><span class="faint">→</span><span class="branch" x-text="detail.mr.target_branch"></span>
                    <span class="sep">·</span>
                    <span class="mono"><span class="add" x-text="'+' + detail.add"></span> <span class="del" x-text="'−' + detail.del"></span></span>
                    <span class="sep">·</span>
                    <span class="faint" x-text="t('mr.updated', { when: relTime(detail.mr.updated_at) })"></span>
                    <span class="chip draft" x-show="detail.mr.draft">draft</span>
                    <span class="chip danger" x-show="detail.mr.has_conflicts" x-text="t('common.conflicts')"></span>
                    <span class="chip warn" x-show="status(detail.pid, detail.mr).outdated" :title="t('mr.newCommitsTitle')" x-text="t('mr.newCommits')"></span>
                  </div>
                </div>
                <span class="status-pill"><span class="dot" :class="status(detail.pid, detail.mr).dot"></span><span x-text="status(detail.pid, detail.mr).label"></span></span>
              </div>

              <div class="tabs-row">
                <div class="tabs">
                  <button class="tab" :class="{ on: route.tab === 'review' }" @click="setTab('review')">Review <span class="n" x-show="currentReview" x-text="(currentReview?.issues || []).length"></span></button>
                  <button class="tab" :class="{ on: route.tab === 'changes' }" @click="setTab('changes')"><span x-text="t('mr.tabChanges')"></span> <span class="n" x-text="detail.files.length"></span></button>
                  <button class="tab" :class="{ on: route.tab === 'description' }" @click="setTab('description')" x-text="t('mr.tabDescription')"></button>
                </div>
                <div class="head-actions">
                  <button class="btn-primary" @click="startReview(detail.pid, detail.iid)" :disabled="!!currentRunning">
                    <template x-if="currentRunning"><span class="spinner" style="border-top-color: var(--primary-text)"></span></template>
                    <template x-if="!currentRunning"><svg class="icon icon-sm" style="fill: currentColor"><use href="#i-play"/></svg></template>
                    <span x-text="t(currentRunning ? 'mr.analyzing' : (currentReview ? 'mr.rerun' : 'common.runReview'))"></span>
                  </button>
                  <a class="btn-outline" :href="detail.mr.web_url" target="_blank" rel="noopener"><svg class="icon icon-sm"><use href="#i-external"/></svg>GitLab</a>
                  <button class="btn-ghost danger" x-show="currentReview && !currentRunning" @click="clearReview(detail.pid, detail.iid)" :title="t('mr.deleteTitle')"><svg class="icon icon-sm"><use href="#i-trash"/></svg></button>
                </div>
              </div>

              <template x-if="currentRunning">
                <div class="progress">
                  <span class="dot purple pulse"></span>
                  <b x-text="t((currentRunning.engine || config.engine) === 'claude-code' ? 'mr.agentAnalyzing' : 'mr.analyzingFiles')"></b>
                  <span class="faint" x-show="(currentRunning.engine || config.engine) !== 'claude-code' && currentRunning.total" x-text="t('mr.fileProgress', { done: currentRunning.done || 0, total: currentRunning.total })"></span>
                  <span class="faint" x-show="(currentRunning.engine || config.engine) === 'claude-code'" x-text="t('mr.agentProgress', { files: currentRunning.total ? tn('common.files', currentRunning.total) : '?' })"></span>
                  <div class="bar" :class="{ indeterminate: (currentRunning.engine || config.engine) === 'claude-code' || !currentRunning.total }">
                    <i :style="currentRunning.total ? 'width:' + Math.round(100 * (currentRunning.done || 0) / currentRunning.total) + '%' : ''"></i>
                  </div>
                  <span class="mono faint" x-text="elapsed(currentRunning.started_at)"></span>
                </div>
              </template>
            </div>

            <div class="content">
              <!-- REVIEW TAB -->
              <template x-if="route.tab === 'review'">
                <div class="detail-body">
                  <template x-if="currentError && !currentRunning">
                    <div class="card" style="border-color: color-mix(in srgb, var(--red) 45%, var(--border))">
                      <h3 class="del" x-text="t('mr.lastFailed')"></h3>
                      <div class="mono muted" style="white-space: pre-wrap" x-text="currentError"></div>
                    </div>
                  </template>

                  <template x-if="!currentReview && !currentRunning">
                    <div class="card"><div class="empty">
                      <h3 x-text="t('mr.noReview')"></h3>
                      <span x-text="t(config.engine === 'claude-code' ? 'mr.noReviewAgent' : 'mr.noReviewLLM')"></span><br />
                      <button class="btn-primary" @click="startReview(detail.pid, detail.iid)"><svg class="icon icon-sm" style="fill: currentColor"><use href="#i-play"/></svg><span x-text="t('common.runReview')"></span></button>
                    </div></div>
                  </template>

                  <template x-if="currentReview">
                    <div>
                      <div class="verdict" :class="currentReview.verdict">
                        <div class="v-icon" x-text="verdict(currentReview.verdict)?.icon || '🤖'"></div>
                        <div style="min-width: 0">
                          <div class="v-title" x-text="verdict(currentReview.verdict)?.label || t('mr.reviewDone')"></div>
                          <div class="v-sub">
                            <span x-text="t('mr.reviewFrom', { date: fullDate(currentReview.timestamp) })"></span>
                            <span x-show="reqSummary(currentReview.requirements)" x-text="t('mr.requirements', { summary: reqSummary(currentReview.requirements) })"></span>
                            <span x-show="currentReview.engine" x-text="' · ' + currentReview.engine"></span>
                            <span x-show="!viewingOldReview && status(detail.pid, detail.mr).outdated" class="del" x-text="t('mr.newCommitsSince')"></span>
                            <span x-show="viewingOldReview" class="del"><span x-text="t('mr.olderVersion')"></span><a href="#" @click.prevent="historyPick = null" style="text-decoration: underline" x-text="t('mr.showLatest')"></a></span>
                          </div>
                        </div>
                        <div class="score"><b x-text="currentReview.score || '—'"></b><span>/10</span></div>
                      </div>

                      <div class="card">
                        <h3 x-text="t('mr.summary')"></h3>
                        <div class="md" x-html="md(currentReview.summary)"></div>
                      </div>

                      <template x-if="(currentReview.requirements || []).length">
                        <div class="card">
                          <h3><svg class="icon icon-sm"><use href="#i-list"/></svg><span x-text="t('mr.requirementsTitle')"></span> <span class="faint" x-text="'· ' + reqSummary(currentReview.requirements)"></span></h3>
                          <table class="req"><tbody>
                            <template x-for="(rq, i) in currentReview.requirements" :key="i">
                              <tr><td x-text="reqIcon(rq.status)"></td><td x-text="rq.requirement"></td><td class="ev" x-text="rq.evidence"></td></tr>
                            </template>
                          </tbody></table>
                        </div>
                      </template>

                      <template x-if="currentReview.followup && (currentReview.followup.items || []).length">
                        <div class="card">
                          <h3><span x-text="t('mr.reReview')"></span> <span class="faint" x-text="t('mr.reReviewSince', { sha: (currentReview.followup.since_sha || '').slice(0, 8), summary: followupSummary(currentReview.followup) })"></span></h3>
                          <table class="req"><tbody>
                            <template x-for="it in currentReview.followup.items" :key="it.id">
                              <tr>
                                <td :title="followupLabel(it.status)" x-text="followupIcon(it.status)"></td>
                                <td>
                                  <div x-text="(it.description || '').split('\n')[0]"></div>
                                  <div class="faint" x-show="it.comment" x-text="it.comment"></div>
                                </td>
                                <td class="ev">
                                  <a x-show="it.url" :href="it.url" target="_blank" rel="noopener" x-text="it.file + ':' + it.line"></a>
                                  <span x-show="!it.url" x-text="it.file + ':' + it.line"></span>
                                </td>
                              </tr>
                            </template>
                          </tbody></table>
                        </div>
                      </template>

                      <div class="card-grid" x-show="currentReview.security_summary || currentReview.quality_summary" style="margin-bottom: 14px">
                        <div class="card" x-show="currentReview.security_summary">
                          <h3><svg class="icon icon-sm"><use href="#i-shield"/></svg><span x-text="t('mr.security')"></span></h3>
                          <div class="md" x-html="md(currentReview.security_summary)"></div>
                        </div>
                        <div class="card" x-show="currentReview.quality_summary">
                          <h3><svg class="icon icon-sm"><use href="#i-bolt"/></svg><span x-text="t('mr.quality')"></span></h3>
                          <div class="md" x-html="md(currentReview.quality_summary)"></div>
                        </div>
                      </div>

                      <div class="section-title" style="margin-top: 8px" x-text="t('mr.issues')"></div>
                      <div class="filters">
                        <button class="filter" :class="{ on: issueFilter === 'all' }" @click="issueFilter = 'all'"><span x-text="t('mr.all')"></span> <span class="mono" x-text="(currentReview.issues || []).length"></span></button>
                        <template x-for="s in ['critical', 'high', 'medium', 'low']" :key="s">
                          <button class="filter" :class="{ on: issueFilter === s }" @click="issueFilter = s" x-show="severityCounts(currentReview)[s]">
                            <span class="sev" :class="s" x-text="s"></span><span class="mono" x-text="severityCounts(currentReview)[s]"></span>
                          </button>
                        </template>
                      </div>
                      <template x-if="!(currentReview.issues || []).length">
                        <div class="card"><div class="empty" style="padding: 24px"><h3 x-text="t('mr.noIssues')"></h3><span x-text="t('mr.noIssuesText')"></span></div></div>
                      </template>
                      <template x-for="g in issueGroups" :key="g.file">
                        <div class="file-group">
                          <div class="file-group-head">
                            <svg class="icon icon-sm"><use :href="g.file ? '#i-file' : '#i-list'"/></svg>
                            <span x-text="g.file || t('mr.generalIssues')"></span>
                            <span class="faint" x-text="'· ' + g.issues.length"></span>
                          </div>
                          <template x-for="(i, idx) in g.issues" :key="idx">
                            <div @click="gotoIssue(i)" :style="i.file && i.line ? 'cursor: pointer' : ''" :title="i.file && i.line ? t('mr.showInChanges') : ''" x-html="issueCardHTML(i, true)"></div>
                          </template>
                        </div>
                      </template>

                      <template x-if="history.length > 1">
                        <div class="card" style="margin-top: 8px">
                          <h3><svg class="icon icon-sm"><use href="#i-history"/></svg><span x-text="t('mr.history')"></span> <span class="faint" x-text="'· ' + history.length"></span></h3>
                          <div class="history">
                            <template x-for="(h, hi) in history" :key="h.id">
                              <button class="history-item" :class="{ on: (historyPick || history[0].id) === h.id }" @click="historyPick = hi === 0 ? null : h.id; issueFilter = 'all'">
                                <span class="dot" :class="verdict(h.verdict)?.dot || 'blue'"></span>
                                <span x-text="verdict(h.verdict)?.short || t('status.reviewed')"></span>
                                <span class="mono faint" x-text="(h.score || '—') + '/10'"></span>
                                <span class="faint" x-text="fullDate(h.timestamp)"></span>
                                <span class="mono faint ml-auto" x-text="(h.sha || '').slice(0, 8)"></span>
                              </button>
                            </template>
                          </div>
                        </div>
                      </template>

                      <template x-if="(currentReview.suggestions || []).length">
                        <div class="card" style="margin-top: 8px">
                          <h3 x-text="t('mr.suggestions')"></h3>
                          <div class="md"><ul><template x-for="(s, i) in currentReview.suggestions" :key="i"><li x-html="md(s)"></li></template></ul></div>
                        </div>
                      </template>
                    </div>
                  </template>
                </div>
              </template>

              <!-- CHANGES TAB -->
              <template x-if="route.tab === 'changes'">
                <div class="changes">
                  <div class="file-tree">
                    <div class="ft-summary"><span x-text="tn('common.files', detail.files.length)"></span> · <span class="add mono" x-text="'+' + detail.add"></span> <span class="del mono" x-text="'−' + detail.del"></span></div>
                    <template x-for="(f, fi) in detail.files" :key="fi">
                      <div class="ft-item" @click="gotoFile(fi)" :title="f.new_path">
                        <svg class="icon icon-sm faint"><use href="#i-file"/></svg>
                        <span class="ellipsis" x-text="f.new_path.split('/').pop()"></span>
                        <span class="stats">
                          <span class="issues" x-show="fileIssues(f.new_path).length" x-text="fileIssues(f.new_path).length"></span>
                          <span class="add" x-text="'+' + f.add"></span><span class="del" x-text="'−' + f.del"></span>
                        </span>
                      </div>
                    </template>
                  </div>
                  <div style="min-width: 0">
                    <template x-if="!detail.files.length"><div class="card"><div class="empty" x-text="t('mr.noChanges')"></div></div></template>
                    <template x-for="(f, fi) in detail.files" :key="fi">
                      <div class="diff-file" :id="'f-' + fi">
                        <div class="diff-file-head" @click="collapsed[fi] = !collapsed[fi]">
                          <span class="tree-chevron" :class="{ open: !collapsed[fi] }"><svg class="icon icon-sm"><use href="#i-chevron"/></svg></span>
                          <span class="path ellipsis" x-text="f.new_path"></span>
                          <span class="chip ok" x-show="f.new_file" x-text="t('mr.newFile')"></span>
                          <span class="chip danger" x-show="f.deleted_file" x-text="t('mr.deletedFile')"></span>
                          <span class="chip" x-show="f.renamed_file" x-text="t('mr.renamedFrom', { path: f.old_path })"></span>
                          <span class="stats">
                            <span class="del" x-show="fileIssues(f.new_path).length" x-text="tn('common.issues', fileIssues(f.new_path).length)"></span>
                            <span class="add" x-text="'+' + f.add"></span><span class="del" x-text="'−' + f.del"></span>
                          </span>
                        </div>
                        <div x-show="!collapsed[fi]" x-html="diffHTML(fi)"></div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>

              <!-- DESCRIPTION TAB -->
              <template x-if="route.tab === 'description'">
                <div class="detail-body">
                  <div class="card">
                    <h3 x-text="t('mr.descriptionTitle')"></h3>
                    <div class="md" x-show="detail.mr.description" x-html="md(detail.mr.description)"></div>
                    <div class="faint" x-show="!detail.mr.description" x-text="t('mr.noDescription')"></div>
                  </div>
                  <div class="card">
                    <h3 x-text="t('mr.info')"></h3>
                    <dl class="info-grid">
                      <dt x-text="t('common.author')"></dt><dd x-text="detail.mr.author?.name + (detail.mr.author?.username ? ' (@' + detail.mr.author.username + ')' : '')"></dd>
                      <dt x-text="t('common.branches')"></dt><dd><span class="branch" x-text="detail.mr.source_branch"></span> → <span class="branch" x-text="detail.mr.target_branch"></span></dd>
                      <dt x-text="t('mr.mergeStatus')"></dt><dd x-text="mergeStatus(detail.mr.detailed_merge_status)"></dd>
                      <dt>Pipeline</dt><dd x-text="detail.mr.pipeline_status || '—'"></dd>
                      <dt x-text="t('mr.comments')"></dt><dd x-text="detail.mr.user_notes_count"></dd>
                      <dt x-text="t('mr.labels')"></dt><dd><template x-for="l in detail.mr.labels" :key="l"><span class="chip label" style="margin-right: 4px" x-text="l"></span></template><span class="faint" x-show="!detail.mr.labels.length">—</span></dd>
                      <dt x-text="t('mr.created')"></dt><dd x-text="fullDate(detail.mr.created_at)"></dd>
                      <dt x-text="t('mr.updatedAt')"></dt><dd x-text="fullDate(detail.mr.updated_at)"></dd>
                      <dt>Commit</dt><dd class="mono" x-text="(detail.mr.sha || '').slice(0, 12)"></dd>
                      <dt x-text="t('mr.aiComments')"></dt><dd x-text="t(config.post_to_gitlab ? (config.gitlab_mode === 'comment' ? 'mr.aiCommentsComment' : 'mr.aiCommentsDraft') : 'mr.aiCommentsOff')"></dd>
                    </dl>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- ---------- SETTINGS ---------- -->
    <template x-if="route.view === 'settings'">
      <div style="display: contents">
        <div class="page-head">
          <div style="min-width: 0">
            <div class="page-title" x-text="t('common.settings')"></div>
            <div class="faint" style="font-size: 12.5px" x-show="settings.dbPath"><span x-text="t('settings.storedIn')"></span> <span class="mono" x-text="settings.dbPath"></span> <span x-text="t('settings.overridesEnv')"></span></div>
          </div>
          <div class="head-actions">
            <button class="btn-ghost" x-show="dirtyCount" @click="discardSettings()" x-text="t('settings.discard')"></button>
            <button class="btn-primary" :disabled="!dirtyCount || settings.saving" @click="saveSettings()">
              <template x-if="settings.saving"><span class="spinner" style="border-top-color: var(--primary-text)"></span></template>
              <span x-text="dirtyCount ? t('settings.save', { n: dirtyCount }) : t('settings.saved')"></span>
            </button>
          </div>
        </div>
        <div class="content">
          <template x-if="settings.loading && !settings.items.length"><div class="skeleton" style="width: 50%"></div></template>
          <template x-if="settings.error"><div class="card"><div class="empty"><h3 x-text="t('settings.loadFailed')"></h3><span x-text="settings.error"></span></div></div></template>
          <div class="settings-layout" x-show="settings.items.length">
            <nav class="settings-nav">
              <template x-for="g in settings.groups" :key="g.id">
                <button @click="scrollToGroup(g.id)">
                  <span x-text="g.label"></span>
                  <span class="dot purple" x-show="groupItems(g.id).some(s => isDirty(s))" :title="t('settings.unsaved')"></span>
                </button>
              </template>
            </nav>
            <div style="min-width: 0">
              <template x-for="g in settings.groups" :key="g.id">
                <section class="card settings-group" :id="'sg-' + g.id">
                  <div class="sg-head">
                    <div style="min-width: 0">
                      <h3 x-text="g.label"></h3>
                      <div class="faint" style="font-size: 12.5px" x-text="g.description"></div>
                    </div>
                    <template x-if="g.test">
                      <div class="sg-test">
                        <span class="test-result" x-show="tests[g.test] && !tests[g.test].loading" :class="tests[g.test]?.ok ? 'add' : 'del'" x-text="tests[g.test]?.message"></span>
                        <button class="btn-outline" @click="testConnection(g.test)" :disabled="tests[g.test]?.loading">
                          <template x-if="tests[g.test]?.loading"><span class="spinner"></span></template>
                          <span x-text="t('settings.test')"></span>
                        </button>
                      </div>
                    </template>
                  </div>
                  <template x-for="s in groupItems(g.id)" :key="s.key">
                    <div class="setting-row" :class="{ dirty: isDirty(s) }">
                      <div class="setting-label">
                        <div class="sl-top">
                          <span x-text="s.label"></span>
                          <span class="src" :class="resets[s.key] ? 'reset' : s.source" x-text="sourceLabel(s)"></span>
                          <span class="chip warn" x-show="s.restart">restart</span>
                        </div>
                        <div class="mono faint sl-key" x-text="s.key"></div>
                        <div class="sl-desc" x-show="s.description" x-text="s.description"></div>
                      </div>
                      <div class="setting-input">
                        <template x-if="s.type === 'bool'">
                          <button class="switch" :class="{ on: fieldValue(s) === 'true' }" @click="toggleField(s)" role="switch" :aria-checked="fieldValue(s) === 'true'"><i></i></button>
                        </template>
                        <template x-if="s.type === 'select'">
                          <select class="input" :value="fieldValue(s)" @change="setField(s, $event.target.value)">
                            <template x-for="o in s.options" :key="o"><option :value="o" x-text="o" :selected="o === fieldValue(s)"></option></template>
                          </select>
                        </template>
                        <template x-if="s.type === 'secret'">
                          <input class="input mono" type="password" autocomplete="new-password" :value="fieldValue(s)" :placeholder="secretPlaceholder(s)" @input="setField(s, $event.target.value)" />
                        </template>
                        <template x-if="s.type === 'int'">
                          <input class="input mono" type="number" min="0" :value="fieldValue(s)" :placeholder="s.default" @input="setField(s, $event.target.value)" />
                        </template>
                        <template x-if="s.type === 'string' || s.type === 'list'">
                          <input class="input" :class="{ mono: s.type === 'list' || s.key.endsWith('_URL') || s.key.endsWith('PATTERN') }" type="text" :value="fieldValue(s)" :placeholder="s.placeholder || s.default" @input="setField(s, $event.target.value)" />
                        </template>
                        <div class="setting-actions">
                          <button class="link" x-show="isDirty(s)" @click="undoField(s)" x-text="t('settings.undo')"></button>
                          <button class="link" x-show="s.source === 'ui' && !resets[s.key]" @click="resetField(s)" x-text="t(s.env_set ? 'settings.restoreEnv' : 'settings.restoreDefault')"></button>
                        </div>
                      </div>
                    </div>
                  </template>
                </section>
              </template>
            </div>
          </div>
        </div>
      </div>
    </template>
  </main>
</div>

<!-- toasts -->
<div class="toasts">
  <template x-for="t in toasts" :key="t.id">
    <div class="toast">
      <span class="dot" :class="t.dot"></span>
      <div style="min-width: 0"><b x-text="t.title"></b><span x-text="t.text"></span></div>
      <button @click="toasts = toasts.filter(x => x.id !== t.id)"><svg class="icon icon-sm"><use href="#i-x"/></svg></button>
    </div>
  </template>
</div>

</body>
</html>
