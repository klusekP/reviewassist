<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Review AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border-left: 4px solid #667eea;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .merge-requests {
            display: grid;
            gap: 15px;
        }

        .mr-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .mr-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .mr-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .mr-title {
            font-weight: bold;
            color: #333;
            font-size: 1.1em;
        }

        .mr-id {
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 15px;
            font-size: 0.8em;
        }

        .mr-author {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .mr-branches {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .branch {
            background: #e9ecef;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 0.8em;
            color: #666;
        }

        .mr-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.2s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a6fd8;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .review-result {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-top: 15px;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .review-score {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .review-summary {
            margin-bottom: 15px;
            color: #333;
        }

        .review-issues {
            margin-bottom: 15px;
        }

        .issue {
            background: white;
            border-left: 4px solid #dc3545;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 0 5px 5px 0;
        }

        .issue.high {
            border-left-color: #ffc107;
        }

        .issue.medium {
            border-left-color: #fd7e14;
        }

        .issue.low {
            border-left-color: #28a745;
        }

        .issue-type {
            font-weight: bold;
            color: #333;
        }

        .issue-severity {
            font-size: 0.8em;
            color: #666;
            margin-left: 10px;
        }

        .issue-description {
            margin-top: 5px;
            color: #666;
        }

        .issue-file {
            margin-top: 5px;
            font-size: 0.8em;
            color: #999;
            font-family: monospace;
        }

        .review-suggestions ul {
            margin-left: 20px;
        }

        .review-suggestions li {
            margin-bottom: 5px;
            color: #666;
        }

        .review-status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .status-reviewed {
            background: #d4edda;
            color: #155724;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 10px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .content {
                padding: 20px;
            }

            .mr-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .mr-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Code Review AI</h1>
            <p>Automatyczna recenzja kodu z GitLab i OpenAI</p>
        </div>

        <div class="content">
            <div id="message"></div>

            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="totalMRs">-</div>
                    <div class="stat-label">Merge Requests</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="reviewedMRs">-</div>
                    <div class="stat-label">Przejrzane</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="avgScore">-</div>
                    <div class="stat-label">Średnia ocena</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalIssues">-</div>
                    <div class="stat-label">Znalezione problemy</div>
                </div>
            </div>

            <div class="section">
                <h2>Merge Requests</h2>
                <div id="mergeRequests" class="merge-requests">
                    <div class="loading">Ładowanie...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api/v1';
        
        // Przechowywanie wyników recenzji w localStorage
        const REVIEW_STORAGE_KEY = 'codereview_results';

        // Funkcje pomocnicze
        function showMessage(message, type = 'success') {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="${type}">${message}</div>`;
            setTimeout(() => {
                messageDiv.innerHTML = '';
            }, 5000);
        }

        function formatDate(dateString) {
            return new Date(dateString).toLocaleDateString('pl-PL', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function getSeverityColor(severity) {
            switch (severity.toLowerCase()) {
                case 'critical': return '#dc3545';
                case 'high': return '#fd7e14';
                case 'medium': return '#ffc107';
                case 'low': return '#28a745';
                default: return '#6c757d';
            }
        }

        // Zarządzanie wynikami recenzji
        function saveReviewResult(iid, review) {
            const results = getReviewResults();
            results[iid] = {
                ...review,
                timestamp: new Date().toISOString()
            };
            localStorage.setItem(REVIEW_STORAGE_KEY, JSON.stringify(results));
        }

        function getReviewResults() {
            const stored = localStorage.getItem(REVIEW_STORAGE_KEY);
            return stored ? JSON.parse(stored) : {};
        }

        function getReviewResult(iid) {
            const results = getReviewResults();
            return results[iid] || null;
        }

        function clearReviewResult(iid) {
            const results = getReviewResults();
            delete results[iid];
            localStorage.setItem(REVIEW_STORAGE_KEY, JSON.stringify(results));
        }

        // API calls
        async function fetchMergeRequests() {
            try {
                const response = await fetch(`${API_BASE}/merge-requests?state=opened`);
                if (!response.ok) throw new Error('Błąd pobierania MR');
                return await response.json();
            } catch (error) {
                console.error('Błąd:', error);
                throw error;
            }
        }

        async function reviewMergeRequest(iid) {
            try {
                const response = await fetch(`${API_BASE}/merge-requests/${iid}/review`, {
                    method: 'POST'
                });
                if (!response.ok) throw new Error('Błąd recenzji');
                return await response.json();
            } catch (error) {
                console.error('Błąd:', error);
                throw error;
            }
        }

        // UI functions
        function createMRCard(mr) {
            const reviewResult = getReviewResult(mr.iid);
            const hasReview = reviewResult !== null;
            
            return `
                <div class="mr-card" data-iid="${mr.iid}">
                    <div class="mr-header">
                        <div class="mr-title">${mr.title}</div>
                        <div class="mr-id">#${mr.iid}</div>
                    </div>
                    <div class="mr-author">Autor: ${mr.author.name}</div>
                    <div class="mr-branches">
                        <div class="branch">${mr.source_branch} → ${mr.target_branch}</div>
                    </div>
                    ${hasReview ? `<div class="review-status status-reviewed">✓ Przejrzane (${formatDate(reviewResult.timestamp)})</div>` : ''}
                    <div class="mr-actions">
                        <button class="btn btn-primary" onclick="viewMR(${mr.iid})">Szczegóły</button>
                        <button class="btn btn-success" onclick="reviewMR(${mr.iid})" ${hasReview ? 'disabled' : ''}>
                            ${hasReview ? 'Przejrzane' : 'Recenzja AI'}
                        </button>
                        ${hasReview ? `<button class="btn btn-secondary" onclick="clearReview(${mr.iid})">Wyczyść</button>` : ''}
                        <a href="${mr.web_url}" target="_blank" class="btn btn-secondary">GitLab</a>
                    </div>
                    <div id="review-result-${mr.iid}">
                        ${hasReview ? createReviewResultHTML(reviewResult, mr) : ''}
                    </div>
                </div>
            `;
        }

        function createReviewResultHTML(review, mr) {
            const issuesHtml = review.issues.map(issue => `
                <div class="issue ${issue.severity.toLowerCase()}">
                    <div>
                        <span class="issue-type">${issue.type}</span>
                        <span class="issue-severity">(${issue.severity})</span>
                    </div>
                    <div class="issue-description">${issue.description}</div>
                    ${issue.file ? `<div class="issue-file">Plik: ${issue.file}:${issue.line}</div>` : ''}
                </div>
            `).join('');

            const suggestionsHtml = review.suggestions.map(suggestion => 
                `<li>${suggestion}</li>`
            ).join('');

            return `
                <div class="review-result">
                    <div class="review-score">Ocena: ${review.score}/10</div>
                    <div class="review-summary">${review.summary}</div>
                    <div class="review-issues">
                        <h4>Znalezione problemy (${review.issues.length}):</h4>
                        ${issuesHtml}
                    </div>
                    <div class="review-suggestions">
                        <h4>Sugestie:</h4>
                        <ul>${suggestionsHtml}</ul>
                    </div>
                </div>
            `;
        }

        // Event handlers
        async function viewMR(iid) {
            try {
                const response = await fetch(`${API_BASE}/merge-requests/${iid}`);
                const data = await response.json();
                showMessage(`Pobrano szczegóły MR #${iid}`, 'success');
            } catch (error) {
                showMessage(`Błąd pobierania MR #${iid}: ${error.message}`, 'error');
            }
        }

        async function reviewMR(iid) {
            const button = event.target;
            const originalText = button.textContent;
            
            try {
                button.textContent = 'Recenzuję...';
                button.disabled = true;

                const result = await reviewMergeRequest(iid);
                
                // Zapisz wynik recenzji
                saveReviewResult(iid, result.review);
                
                // Zaktualizuj UI
                const resultDiv = document.getElementById(`review-result-${iid}`);
                resultDiv.innerHTML = createReviewResultHTML(result.review, result.merge_request);
                
                // Zaktualizuj przycisk
                button.textContent = 'Przejrzane';
                button.disabled = true;
                
                // Dodaj przycisk wyczyszczenia
                const actionsDiv = button.parentElement;
                const clearButton = document.createElement('button');
                clearButton.className = 'btn btn-secondary';
                clearButton.textContent = 'Wyczyść';
                clearButton.onclick = () => clearReview(iid);
                actionsDiv.appendChild(clearButton);
                
                // Dodaj status
                const statusDiv = document.createElement('div');
                statusDiv.className = 'review-status status-reviewed';
                statusDiv.textContent = `✓ Przejrzane (${formatDate(new Date().toISOString())})`;
                button.parentElement.parentElement.insertBefore(statusDiv, button.parentElement);
                
                showMessage(`Recenzja MR #${iid} zakończona! Analiza przeprowadzona lokalnie.`, 'success');
                
                // Aktualizuj statystyki
                updateStats();
            } catch (error) {
                showMessage(`Błąd recenzji MR #${iid}: ${error.message}`, 'error');
                button.textContent = originalText;
                button.disabled = false;
            }
        }

        function clearReview(iid) {
            clearReviewResult(iid);
            loadMergeRequests(); // Przeładuj listę
            showMessage(`Wyczyszczono recenzję MR #${iid}`, 'success');
        }

        async function updateStats() {
            try {
                const mrs = await fetchMergeRequests();
                const reviewResults = getReviewResults();
                
                document.getElementById('totalMRs').textContent = mrs.count;
                document.getElementById('reviewedMRs').textContent = Object.keys(reviewResults).length;
                
                // Oblicz średnią ocenę
                const scores = Object.values(reviewResults).map(r => r.score);
                const avgScore = scores.length > 0 ? (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1) : '-';
                document.getElementById('avgScore').textContent = avgScore;
                
                // Oblicz liczbę problemów
                const totalIssues = Object.values(reviewResults).reduce((sum, r) => sum + r.issues.length, 0);
                document.getElementById('totalIssues').textContent = totalIssues;
            } catch (error) {
                console.error('Błąd aktualizacji statystyk:', error);
            }
        }

        async function loadMergeRequests() {
            try {
                const mrs = await fetchMergeRequests();
                const container = document.getElementById('mergeRequests');
                
                if (mrs.count === 0) {
                    container.innerHTML = '<div class="loading">Brak otwartych Merge Requests</div>';
                    return;
                }

                container.innerHTML = mrs.merge_requests.map(createMRCard).join('');
                updateStats();
            } catch (error) {
                document.getElementById('mergeRequests').innerHTML = 
                    `<div class="error">Błąd ładowania Merge Requests: ${error.message}</div>`;
            }
        }

        // Inicjalizacja
        document.addEventListener('DOMContentLoaded', () => {
            loadMergeRequests();
            
            // Odświeżaj co 30 sekund
            setInterval(loadMergeRequests, 30000);
        });
    </script>
</body>
</html>
